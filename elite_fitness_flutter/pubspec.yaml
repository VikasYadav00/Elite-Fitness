name: elite_fitness
description: Elite Fitness Gym Management System - Cross Platform Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # HTTP Client
  dio: ^5.7.0

  # Navigation
  go_router: ^14.6.2

  # Local Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Charts
  fl_chart: ^0.69.0

  # Icons
  cupertino_icons: ^1.0.8

  # PDF & Printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # Image handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

