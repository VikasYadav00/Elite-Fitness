<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Elite Fitness Portal Redirect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #0B0F17;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(245, 158, 11, 0.2);
      border-top-color: #F59E0B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    // GitHub Pages SPA router redirect handler
    (function () {
      var l = window.location;
      var path = l.pathname;
      var search = l.search;
      var hash = l.hash;

      // Determine repository base path
      var repoPrefix = '/Elite-Fitness';
      var isRepoSubpath = path.toLowerCase().indexOf(repoPrefix.toLowerCase()) === 0;
      var basePath = isRepoSubpath ? repoPrefix : '';
      var routePath = isRepoSubpath ? path.substring(repoPrefix.length) : path;

      // Normalize trailing slash
      if (!routePath || routePath === '/') {
        routePath = '';
      }

      // Check specific routes
      var lowerRoute = routePath.toLowerCase();
      if (lowerRoute.indexOf('/qr') !== -1) {
        l.replace(basePath + '/?qr=1' + (search ? '&' + search.replace(/^\?/, '') : '') + hash);
        return;
      }
      if (lowerRoute.indexOf('/feedback') !== -1) {
        l.replace(basePath + '/?feedback=1' + (search ? '&' + search.replace(/^\?/, '') : '') + hash);
        return;
      }
      if (lowerRoute.indexOf('/register') !== -1) {
        l.replace(basePath + '/?register=1' + (search ? '&' + search.replace(/^\?/, '') : '') + hash);
        return;
      }
      if (lowerRoute.indexOf('/checkin') !== -1 || lowerRoute.indexOf('/attendance') !== -1) {
        l.replace(basePath + '/?checkin=1' + (search ? '&' + search.replace(/^\?/, '') : '') + hash);
        return;
      }
      if (lowerRoute.indexOf('/complaint') !== -1) {
        l.replace(basePath + '/?complaint=1' + (search ? '&' + search.replace(/^\?/, '') : '') + hash);
        return;
      }

      // Universal SPA fallback: preserve route in query string (?p=/...)
      var queryRedirect = (search ? search + '&' : '?') + 'p=' + encodeURIComponent(routePath);
      l.replace(basePath + '/' + queryRedirect + hash);
    })();
  </script>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <h2 style="font-size: 1.25rem; font-weight: 700; color: #F59E0B; margin: 0 0 8px;">
      ⚡ Elite Fitness
    </h2>
    <p style="color: #94A3B8; font-size: 0.9rem; margin: 0;">
      Opening portal...
    </p>
  </div>
</body>
</html>
